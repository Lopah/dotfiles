# Shared by every system. `install` adds install.unix.conf.yaml and
# `install.ps1` adds install.windows.conf.yaml; dotbot reads one file per run,
# so each file repeats these defaults.
- defaults:
    link:
      relink: true
      create: true
      force: true

# Removes the ~/.vim/bundle link left by the Vundle setup on existing installs.
- clean:
    - ~/.vim

- link:
    ~/.gitconfig:
        path: .gitconfig
        force: false
        relink: false
    ~/.vimrc: nvim/.vimrc
    ~/.vim/colors: nvim/.vim/colors
    ~/.config/neofetch/config.conf: neofetch/.config/config.conf
    ~/.config/git/prune-merged: git/prune-merged
    ~/.bash_profile: .bash_profile
    ~/.bashrc: bashrc/.bash_profile
    ~/.zshrc:
        path: zsh/.zshrc

# dotbot applies the mode with an explicit chmod, so without one these would
# be world-writable regardless of the umask.
- create:
    ~/downloads:
        mode: 0755
    # Undo files hold the contents of edited files.
    ~/.vim/undo-history:
        mode: 0700

- shell:
  - command: git submodule update --init --recursive
    description: Installing submodules
    stderr: true
