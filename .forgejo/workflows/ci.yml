name: CI

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTFILES_TEST_IMAGE: dotfiles-integration-tests:${{ forgejo.run_id }}

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.head_ref || forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (.NET 11)
    runs-on: ubuntu-22.04
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: Install .NET SDK
        uses: https://github.com/actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/Dotfiles.IntegrationTests.sln

      - name: Build
        run: dotnet build tests -c Release --no-restore

      - name: Build integration test image
        run: >-
          docker build --progress=plain
          --tag "$DOTFILES_TEST_IMAGE"
          --file tests/DotFiles.IntegrationTests/Dockerfile .

      - name: Test
        run: dotnet test --solution tests/Dotfiles.IntegrationTests.sln -c Release --no-build

      - name: Remove integration test image
        if: always()
        run: docker image rm "$DOTFILES_TEST_IMAGE" || true
